[package]
name = "chess-review"
version = "1.0.0"
description = "Game review for your chess.com games"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shakmaty = "0.30"
reqwest = { version = "0.13", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
libloading = "0.7"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
